<section class="bg-light-black" data-footer-feature="">
<div class="container">
<div class="grid grid-cols-1 gap-8 rounded-2xl bg-red-hot px-6 py-6 text-light-black sm:rounded-3xl sm:px-8 sm:py-8 md:grid-cols-3 md:py-0 lg:gap-24 lg:px-12">
<div class="block-content col-span-1 text-balance md:col-span-2 md:py-8 lg:py-10">
<h5 class="is-h5" id="@@FORM_ID@@-title">Hírek, újdonságok és ajánlatok</h5>
<div class="mt-4 lg:mt-6">
<form aria-labelledby="@@FORM_ID@@-title" class="grid grid-cols-1 gap-x-5 gap-y-6 md:grid-cols-2" data-newsletter-preview="" method="post">
<div>
<label class="is-technical-scale mb-3 flex" for="@@FORM_ID@@-firstname">Keresztnév</label>
<input autocomplete="given-name" class="@@FIELD_CLASS@@" id="@@FORM_ID@@-firstname" maxlength="200" name="firstname" placeholder="Anna" type="text"/>
</div>
<div>
<label class="is-technical-scale mb-3 flex" for="@@FORM_ID@@-lastname">Vezetéknév</label>
<input autocomplete="family-name" class="@@FIELD_CLASS@@" id="@@FORM_ID@@-lastname" maxlength="200" name="lastname" placeholder="Kovács" type="text"/>
</div>
<div class="col-span-full">
<label class="is-technical-scale mb-3 flex" for="@@FORM_ID@@-email">E-mail-cím *</label>
<input aria-describedby="@@FORM_ID@@-status" autocomplete="email" class="@@FIELD_CLASS@@" id="@@FORM_ID@@-email" maxlength="200" name="email" placeholder="anna@pelda.hu" required="" type="email"/>
</div>
<p class="col-span-full font-technical text-[max(18px,1.1vw)] leading-none font-bold uppercase" data-newsletter-status="" hidden="" id="@@FORM_ID@@-status" role="status"></p>
<div class="col-span-full md:max-w-[250px]">
@@SUBMIT_BUTTON@@
</div>
</form>

</div>
</div>
<div class="relative w-full max-sm:hidden" data-dance="">
@@NEWSLETTER_ART@@
</div>
</div>
</div>
</section>
